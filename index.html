<!doctype html>
<html lang="fr" data-mode="auto" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f7">
<title>Split My Money</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2317171c'/%3E%3Ccircle cx='24' cy='32' r='13' fill='%23fff'/%3E%3Ccircle cx='42' cy='32' r='13' fill='%23ff7a9c' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<main>
  <header class="top">
    <div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
    <div class="month">
      <button class="icon-btn" data-act="month-prev" aria-label="Mois précédent">‹</button>
      <span id="monthLabel"></span>
      <button class="icon-btn" data-act="month-next" aria-label="Mois suivant">›</button>
    </div>
  </header>
  <div id="view"></div>
</main>
<button class="fab" data-act="quick" aria-label="Ajouter une dépense">+</button>
<nav id="tabbar" class="tabbar"></nav>
<dialog id="modal"></dialog>
<script src="app.js"></script>
</body>
</html>
