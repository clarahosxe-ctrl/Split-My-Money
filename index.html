<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4cf1">
<title>Split My Money</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236c4cf1'/%3E%3Ccircle cx='24' cy='32' r='13' fill='%23fff'/%3E%3Ccircle cx='42' cy='32' r='13' fill='%23ff7a9c' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"><i></i><i></i></span><span>Split My Money</span></div>
    <nav id="nav"></nav>
    <p class="side-foot">Données enregistrées sur cet appareil.</p>
  </aside>
  <main>
    <header class="top">
      <h1 id="title"></h1>
      <div class="month">
        <button class="icon-btn" data-act="month-prev" aria-label="Mois précédent">‹</button>
        <span id="monthLabel"></span>
        <button class="icon-btn" data-act="month-next" aria-label="Mois suivant">›</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
  <nav id="tabbar" class="tabbar"></nav>
</div>
<dialog id="modal"></dialog>
<script src="app.js"></script>
</body>
</html>
