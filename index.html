<!doctype html>
<html lang="fr" data-mode="auto" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f7">
<title>Split My Money</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split My Money">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header class="top">
    <div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
    <div class="month">
      <button class="icon-btn" data-act="month-prev" aria-label="Mois précédent">‹</button>
      <span id="monthLabel"></span>
      <button class="icon-btn" data-act="month-next" aria-label="Mois suivant">›</button>
    </div>
  </header>
  <div id="view"></div>
</main>
<button class="fab" data-act="quick" aria-label="Ajouter une dépense">+</button>
<nav id="tabbar" class="tabbar"></nav>
<dialog id="modal"></dialog>
<script src="app.js"></script>
</body>
</html>
